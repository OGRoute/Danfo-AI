name: 📋 Scoped task (maintainers)
description: A scoped piece of work for a contributor to pick up
labels: ["help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Maintainers: use this to post work for contributors. Keep it **scoped** —
        a contributor should be able to finish it without needing to ask what it means.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is this, and why does it matter?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: What needs to be done
      description: The specific change. Be concrete.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Where to look
      description: Relevant files / functions.
      placeholder: |
        - components/StellarPanel.tsx (upvote handler)
        - stellar/route-corrections/src/lib.rs (Correction struct)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Correction struct exposes a stable `id`
        - [ ] Upvote uses the contract-provided id (no client-side arithmetic)
        - [ ] `cargo test` covers it
        - [ ] `npm run build` and `npx tsc --noEmit` pass
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: How to verify
      placeholder: |
        cd stellar/route-corrections && cargo test
        curl -s http://localhost:3000/api/corrections
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      options:
        - Good first issue (a few hours)
        - Small (< 1 day)
        - Medium (1-3 days)
        - Large (needs design discussion first)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend / UI
        - Chat (0G Compute)
        - Stellar / Soroban contract
        - Stellar payments / Freighter
        - Voice
        - Map
        - Testing
        - Documentation
        - CI / tooling
        - Accessibility
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Setup needed
      description: Which toolchains does a contributor need for this?
      placeholder: "Node only / Node + Rust + Stellar CLI / Node + Python"
