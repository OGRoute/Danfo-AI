name: 🐛 Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm run dev`
        2. Click ⭐ → Submit a correction
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste the terminal or browser-console output. **Redact any keys.**
      render: shell

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend / UI
        - Chat (0G Compute)
        - Stellar / Soroban contract
        - Stellar payments / Freighter
        - Voice (speech-to-text / text-to-speech)
        - Map
        - Build / tooling
        - Other
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "e.g. Chrome 130, Ubuntu 24.04, Node 20.11"

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have not included any secrets or private keys in this report
          required: true
